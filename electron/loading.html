<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Carnet numérique des ancêtres</title>
<style>
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;background:#fbfbfb;color:#080808;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
       background-image:linear-gradient(rgba(0,102,204,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,102,204,.035) 1px,transparent 1px);background-size:28px 28px}
  main{text-align:center;padding:36px 44px;border:2px solid #080808;background:#fff;box-shadow:8px 8px 0 rgba(0,102,204,.2)}
  h1{font-size:20px;margin:0 0 6px;letter-spacing:-.02em}
  p{margin:0 0 20px;color:#515151;font-weight:600}
  .bar{height:6px;border:2px solid #080808;overflow:hidden;background:#fff}
  .bar i{display:block;height:100%;width:35%;background:#0066cc;animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{margin-left:-35%}100%{margin-left:100%}}
</style>
</head>
<body>
<main>
  <h1>Carnet numérique des ancêtres</h1>
  <p>Démarrage en cours…</p>
  <div class="bar"><i></i></div>
</main>
</body>
</html>
