# 🐚 Chemins de Compostelle : fabriquer assets/data/ha-compostelle.json.gz (OpenStreetMap, ODbL, « © contributeurs
# OpenStreetMap ») avec scripts/histoire-autour/build.py --only compostelle, puis l'enregistrer dans la branche lancée.
# Le service Overpass n'est pas joignable depuis l'atelier de développement : la fabrication se fait ici.
#
# Lancer : onglet « Actions » → « Chemins de Compostelle » → « Run workflow ».

name: Chemins de Compostelle

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/compostelle.yml']

permissions:
  contents: write

concurrency:
  group: compostelle-donnees
  cancel-in-progress: false

jobs:
  donnees:
    # le « push » sert seulement à faire connaître ce travail à GitHub : il ne fabrique rien
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fabriquer les chemins (Overpass, plusieurs essais)
        run: |
          for i in 1 2 3 4 5; do
            python3 scripts/histoire-autour/build.py --cache "$RUNNER_TEMP/ha-cache" --only compostelle && break
            echo "essai $i raté, nouvel essai dans 60 s"; sleep 60
          done
          test -s assets/data/ha-compostelle.json.gz
          ls -l assets/data/ha-compostelle.json.gz
      - name: Enregistrer dans la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/ha-compostelle.json.gz
          git diff --cached --quiet && { echo "rien de neuf"; exit 0; }
          git commit -m "Chemins de Compostelle : données OpenStreetMap (ODbL) fabriquées sur GitHub"
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break; sleep 10; done
