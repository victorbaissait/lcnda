# Fabrication des installateurs de LCNDA (macOS, Windows, Linux).
#
# - Lancement manuel : onglet « Actions » → « Installateurs » → « Run workflow » (fichiers dans « Artifacts »).
# - Nouvelle version : pousser une étiquette, ex. « git tag v0.0.3 && git push origin v0.0.3 » → les installateurs
#   sont envoyés directement dans un BROUILLON de version (onglet « Releases »), publié à la main.
#
# Versions des systèmes fixées exprès (pas de « -latest ») : un changement chez GitHub ne doit pas modifier les
# installateurs sans prévenir. Linux est fabriqué sur Ubuntu 22.04 pour rester compatible avec plus de distributions.
#
# Chaque machine vérifie le PHP embarqué (sha256), lance les tests, puis fabrique ; le garde-fou
# (electron/build/hooks.js) arrête tout si une base, un média ou une sauvegarde se trouvait dans l'application.

name: Installateurs

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Version (étiquette v*) : un seul job crée le brouillon, puis chaque machine y envoie directement ses installateurs
  # (une Release n'occupe pas l'espace de stockage des « Artifacts », limité et déjà saturé une fois).
  prepare:
    name: Brouillon de version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Créer le brouillon, sauf s'il existe déjà (relance)
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          T: ${{ github.ref_name }}
        run: |
          if gh release list --repo "$R" --limit 100 --json tagName -q '.[].tagName' | grep -qx "$T"; then
            echo "Brouillon $T déjà présent"
          else
            gh release create "$T" --draft --repo "$R" --title "LCNDA $T" \
              --notes "Installateurs de LCNDA $T — vérifie les empreintes dans SHA256SUMS.txt."
          fi

  build:
    name: ${{ matrix.name }}
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result != 'failure' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon + Intel)
            os: macos-15
            php: darwin-arm64 darwin-x64
            dist: --mac --arm64 --x64
          - name: Windows (x64)
            os: windows-2025
            php: win32-x64
            dist: --win --x64
          - name: Linux (x64 + ARM)
            os: ubuntu-22.04
            php: linux-x64 linux-arm64
            dist: --linux --x64 --arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: PHP embarqué (téléchargé et vérifié par empreinte sha256)
        shell: bash
        run: for key in ${{ matrix.php }}; do node electron/fetch-php.js "$key"; done

      - name: Répertoire mondial des lieux (GeoNames allCountries, ~420 Mo → ~140 Mo)
        shell: bash
        run: npm run fetch:geo

      - name: Composant Microsoft Visual C++ (officiel, signature vérifiée)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor/vcredist | Out-Null
          Invoke-WebRequest -Uri https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile vendor/vcredist/vc_redist.x64.exe
          $sig = Get-AuthenticodeSignature vendor/vcredist/vc_redist.x64.exe
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw "Signature Microsoft invalide : $($sig.Status) $($sig.SignerCertificate.Subject)"
          }
          Write-Host "Signé par : $($sig.SignerCertificate.Subject)"

      - name: Tests (serveur PHP, sécurité, relais, migrations, GEDCOM, ouverture de base)
        run: |
          npm run test:php
          npm run test:migrations
          npm run test:gedcom
          npm run test:import

      - name: Fabrication des installateurs
        run: npx electron-builder ${{ matrix.dist }} --publish never

      - name: Envoi dans le brouillon de version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          shopt -s nullglob
          files=(*.dmg *.exe *.AppImage *.deb)
          test ${#files[@]} -gt 0
          if command -v sha256sum >/dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          $sum "${files[@]}" > "SHA256SUMS-${{ runner.os }}.txt" && cat "SHA256SUMS-${{ runner.os }}.txt"
          gh release upload "${{ github.ref_name }}" "${files[@]}" "SHA256SUMS-${{ runner.os }}.txt" --clobber --repo "${{ github.repository }}"

      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: LCNDA-${{ runner.os }}
          if-no-files-found: error
          # Lancement manuel seulement ; effacé au bout d'un jour (l'espace de stockage GitHub est limité)
          retention-days: 1
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb

  sums:
    name: Empreintes sha256
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Rassembler SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          T: ${{ github.ref_name }}
        run: |
          gh release download "$T" --repo "$R" --pattern 'SHA256SUMS-*.txt'
          cat SHA256SUMS-*.txt | sort -k2 > SHA256SUMS.txt && cat SHA256SUMS.txt
          gh release upload "$T" SHA256SUMS.txt --clobber --repo "$R"
          for f in SHA256SUMS-*.txt; do gh release delete-asset "$T" "$f" --yes --repo "$R"; done
